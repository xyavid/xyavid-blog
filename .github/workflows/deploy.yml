name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发一次部署
  workflow_dispatch:

# GITHUB_TOKEN 需要的权限：读取仓库、写 Pages、用 OIDC 换取部署凭证
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，排队而不是互相取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # 由 GitHub 自己算出站点地址与子路径：
      # 用户主页仓库得到 base=/ ，普通仓库得到 base=/仓库名 ，配置了自定义域名则是 /
      - name: 读取 Pages 配置
        id: pages
        uses: actions/configure-pages@v5

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 构建站点：astro build 之后会自动跑 Pagefind 生成站内搜索索引
      - name: 构建站点
        run: pnpm build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
